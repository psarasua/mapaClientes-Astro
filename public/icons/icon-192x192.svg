<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="truckGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F8FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con gradiente -->
  <rect x="0" y="0" width="192" height="192" rx="24" fill="url(#bgGradient)"/>
  
  <!-- Sombra del camión -->
  <ellipse cx="96" cy="160" rx="45" ry="8" fill="rgba(0,0,0,0.1)"/>
  
  <!-- Cuerpo principal del camión -->
  <rect x="40" y="80" width="80" height="40" rx="4" fill="url(#truckGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- Cabina del camión -->
  <rect x="120" y="95" width="32" height="25" rx="4" fill="url(#truckGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- Ventana de la cabina -->
  <rect x="125" y="100" width="22" height="8" rx="2" fill="rgba(74,144,226,0.3)"/>
  
  <!-- Ruedas -->
  <circle cx="60" cy="130" r="12" fill="#2D3748" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="135" cy="130" r="12" fill="#2D3748" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Centro de las ruedas -->
  <circle cx="60" cy="130" r="6" fill="#4A5568"/>
  <circle cx="135" cy="130" r="6" fill="#4A5568"/>
  
  <!-- Detalles del camión -->
  <rect x="45" y="85" width="8" height="8" rx="1" fill="rgba(74,144,226,0.6)"/>
  <rect x="45" y="97" width="8" height="8" rx="1" fill="rgba(74,144,226,0.6)"/>
  <rect x="45" y="109" width="8" height="8" rx="1" fill="rgba(74,144,226,0.6)"/>
  
  <!-- Icono de ubicación -->
  <g transform="translate(70, 45)">
    <circle cx="12" cy="12" r="12" fill="#34C759" stroke="white" stroke-width="2"/>
    <circle cx="12" cy="10" r="4" fill="white"/>
    <path d="M12 14 L8 20 L16 20 Z" fill="#34C759"/>
  </g>
  
  <!-- Líneas de movimiento -->
  <g opacity="0.6">
    <path d="M25 70 L35 70" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M25 75 L32 75" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M25 80 L30 80" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>